name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          commit="${GITHUB_SHA::7}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/david-ortega/potator/cmd.version=0.0.0-${commit}" \
            -o "dist/potator_${GOOS}_${GOARCH}${suffix}" .

      # Prove the artefact actually runs, rather than just linking.
      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./dist/potator_linux_amd64 --version

      - uses: actions/upload-artifact@v4
        with:
          name: potator-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
